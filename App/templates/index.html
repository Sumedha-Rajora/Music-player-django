{% load static %}


<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   music player
  </title>
  <link href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mediaelement/4.2.7/mediaelementplayer.min.css" rel="stylesheet"/>
  <link href="{% static './style.css' %}" rel="stylesheet"/>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">

 </head>
 <body>

 
  {% include 'main.html' %}


  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js">
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mediaelement/4.2.7/mediaelement-and-player.min.js">
  </script>
  <script src="{% static './script.js' %}">
  </script>

 <script>
document.addEventListener('DOMContentLoaded', function () {
    const lyricsContainer = document.getElementById('song-lyrics');
    if (!lyricsContainer) return;

    // 1. Parse the JSON data correctly
    let lyricsData = [];
    try {
        lyricsData = JSON.parse(lyricsContainer.getAttribute('data-lyrics'));
    } catch (e) {
        console.error("Failed to parse lyrics JSON", e);
        return;
    }

    // 2. Target the audio element (MediaElement.js creates a hidden native element)
    // We use a selector that works with MediaElementPlayer's structure
    $('audio.fc-media').on('timeupdate', function (e) {
        const currentTime = e.target.currentTime;
        let activeLyric = "";

        // 3. Find the current lyric based on timestamp
        for (let i = 0; i < lyricsData.length; i++) {
            if (currentTime >= timeToSeconds(lyricsData[i].time)) {
                activeLyric = lyricsData[i].lyrics;
            } else {
                break;
            }
        }
        
        // Update the container only if the text changed
        if (lyricsContainer.innerText !== activeLyric) {
            lyricsContainer.innerText = activeLyric;
        }
    });

    function timeToSeconds(time) {
        const [minutes, seconds] = time.split(':').map(parseFloat);
        return minutes * 60 + seconds;
    }
});

</script>
